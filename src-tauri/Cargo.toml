[package]
name = "quickpaste"
version = "0.2.18"
description = "QuickCopy —— 局域网剪贴板历史与文件互传"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quickpaste_lib"
crate-type = ["rlib"]

# tauri build 打包（NSIS/deb）时 CLI 会传 --features custom-protocol。
# 这是项目级 feature（tauri 1 惯例），必须在主 crate 声明。
[features]
# tauri build 打包（NSIS/deb）时 CLI 会传 --features custom-protocol。
# 必须转发到 tauri/custom-protocol，否则生产构建仍按 dev 模式加载 devPath（localhost:1420），
# 打包后窗口显示“无法访问此页面”。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
# Tauri 1（Linux 需 webkit2gtk-4.0，兼容银河麒麟 V10 SP1 / 龙芯等低版本国产系统）
# v1 时代的官方插件（dialog/global-shortcut/single-instance）从未发布 1.x，全部改用内置/独立实现：
#   dialog       → tauri::api::dialog（内核自带，qp_pick_dir 命令）
#   single 实例  → localhost 端口独占 + accept 唤醒（src/single.rs）
#  全局快捷键    → global-hotkey crate（独立库，Win/Linux X11）
tauri = { version = "1.7", features = ["system-tray", "icon-png", "icon-ico", "dialog-open", "dialog-save", "window-all"] }
global-hotkey = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
clipboard-rs = "0.2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# S2 传输核心（LocalSend v2 兼容）：HTTP 服务器 / 组播发现 / 哈希 / 会话令牌 / HTTP 客户端
tiny_http = "0.12"
socket2 = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false }
local-ip-address = "0.6"
dirs = "5"

# 预留（S 阶段按需启用）：在线更新等扩展
# tauri-plugin-updater = "2"
# 在线更新走系统 curl（静默子进程），ureq 仅用于局域网明文 HTTP，不启用 TLS