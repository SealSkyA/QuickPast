[package]
name = "quickpaste"
version = "0.2.5"
description = "QuickPaste —— 局域网剪贴板历史与文件互传"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quickpaste_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
clipboard-rs = "0.2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# S2 传输核心（LocalSend v2 兼容）：HTTP 服务器 / 组播发现 / 哈希 / 会话令牌 / HTTP 客户端
tiny_http = "0.12"
socket2 = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false }
local-ip-address = "0.6"

# 预留（S 阶段按需启用）：在线更新等扩展
# tauri-plugin-updater = "2"
# 在线更新走系统 curl（静默子进程），ureq 仅用于局域网明文 HTTP，不启用 TLS