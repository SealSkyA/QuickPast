name: build-win-nsis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  nsis:
    # Windows 安装包（NSIS）。本地 Windows 开发机被企业 WDAC 策略阻止 cargo build script 执行，
    # 改用 GitHub Actions 云构建。产物走 artifact，不自动建 Release（遵循统一发布规则）。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 前端依赖
        run: npm ci

      - name: 构建 NSIS 安装包
        # 必须显式传 --features custom-protocol，否则按 dev 模式加载 devPath，产生“无法访问此页面”
        run: npx tauri build --features custom-protocol --bundles nsis

      - name: 汇总产物
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: quickcopy-win-x64-setup
          path: dist/