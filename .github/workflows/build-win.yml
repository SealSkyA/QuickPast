name: build-win

# Tauri 1 迁移后的 Windows 验证：
#  - 普通 push / PR：cargo check --release（快速验证编译）
#  - tag v*：额外执行完整 NSIS 打包并挂到 Release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 前端依赖
        run: npm ci

      - name: Cargo 编译检查（release）
        working-directory: src-tauri
        run: cargo check --release

      - name: Cargo 单测
        working-directory: src-tauri
        run: cargo test --release --all-targets -- --skip net::tests::no_network

  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 前端依赖
        run: npm ci

      - name: 构建 NSIS 安装包
        run: npx tauri build --bundles nsis

      - name: 汇总产物
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: quickcopy-win-x64
          path: dist/

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe